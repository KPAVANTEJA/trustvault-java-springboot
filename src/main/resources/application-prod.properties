# Docurithm production profile for Render + Supabase.
# Oracle remains available for local development through application.properties.

spring.application.name=docurithm
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Supabase PostgreSQL: use the Session Pooler connection details from the dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Private Supabase Storage bucket. Never expose this key to browser code.
trustvault.storage.provider=supabase
trustvault.storage.supabase.url=${SUPABASE_URL}
trustvault.storage.supabase.key=${SUPABASE_SECRET_KEY}
trustvault.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:docurithm-private}
trustvault.storage.directory=${TRUSTVAULT_STORAGE_DIR:/tmp/docurithm-private-files}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

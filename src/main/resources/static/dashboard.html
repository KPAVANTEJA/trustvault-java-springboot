
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .dashboard {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 24px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 30px;
        }
        .dashboard-header h1 {
            font-size: 36px;
            margin: 0;
        }
        .dashboard-panel {
            background: #111824;
            border: 1px solid #273246;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .dashboard-panel h2 {
            margin-top: 0;
        }
        .document-list {
            display: grid;
            gap: 12px;
        }
        .document-item {
            padding: 16px;
            border: 1px solid #273246;
            border-radius: 9px;
            overflow-wrap: anywhere;
        }
        .muted {
            color: #9ca8bb;
        }
        .message {
            margin-top: 16px;
            line-height: 1.6;
        }
        .dashboard-button {
            display: inline-block;
            border: 0;
            cursor: pointer;
            padding: 12px 16px;
            border-radius: 8px;
            background: #8cf0b1;
            color: #0a2016;
            font-weight: 700;
        }
        .dashboard-input {
            display: block;
            width: 100%;
            max-width: 480px;
            margin: 12px 0;
            padding: 12px;
        }
        #document-list {
    min-height: 120px;
    align-content: start;
}

.dashboard-panel {
    overflow: hidden;
}
        
    </style>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="/">
            <span class="brand-icon">T</span>
            TrustVault
        </a>
        <nav>
            <a href="/">Home</a>
            <a href="/logout">Sign Out</a>
        </nav>
    </header>

    <main class="dashboard">
        <div class="dashboard-header">
            <div>
                <p class="eyebrow">SECURE WORKSPACE</p>
                <h1>Document Dashboard</h1>
                <p id="welcome" class="muted">Checking your session...</p>
            </div>
        </div>

        <section class="dashboard-panel">
            <h2>Upload a document</h2>
            <p class="muted">Supported formats: PDF, TXT, PNG, JPG. Maximum size: 10 MB.</p>

            <form id="upload-form">
                <label for="title">Document title</label>
                <input class="dashboard-input" id="title" name="title"
                       maxlength="200" required>

                <label for="file">Choose file</label>
                <input class="dashboard-input" id="file" name="file"
                       type="file" accept=".pdf,.txt,.png,.jpg,.jpeg" required>
                       
				<label for="category">Document Category</label>
<select id="category" name="category">
    <option value="Uncategorized">Uncategorized</option>
    <option value="HR">HR</option>
    <option value="Finance">Finance</option>
    <option value="Contracts">Contracts</option>
    <option value="Reports">Reports</option>
    <option value="Technical">Technical</option>
    <option value="Other">Other</option>
</select>

                <button class="dashboard-button" type="submit">Upload document</button>
                
                
            </form>

            <p id="upload-message" class="message" role="status"></p>
        </section>

        
<section class="dashboard-panel">
    <h2>Your documents</h2>

    <label for="document-search">Search by document title</label>
    <input
        class="dashboard-input"
        id="document-search"
        type="search"
        placeholder="Enter a document title..."
        maxlength="200"
    >
    
   <div class="search-filters">
    <label for="search-owner">Owner</label>
    <input
        type="text"
        id="search-owner"
        placeholder="Search by owner name or email">

    <label for="search-category">Category</label>
    <select id="search-category">
        <option value="">All categories</option>
        <option value="Uncategorized">Uncategorized</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
        <option value="Contracts">Contracts</option>
        <option value="Reports">Reports</option>
        <option value="Technical">Technical</option>
        <option value="Other">Other</option>
    </select>

    <label for="search-from-date">From date</label>
    <input type="date" id="search-from-date">

    <label for="search-to-date">To date</label>
    <input type="date" id="search-to-date">

    <button type="button" id="apply-search-filters">
        Apply Filters
    </button>

    <button type="button" id="clear-search-filters">
        Clear Filters
    </button>
</div>

    <div id="document-list" class="document-list">
        <p class="muted">Loading documents...</p>
    </div>

    <p id="list-message" class="message" role="status"></p>
</section>

    </main>

    <script src="/js/dashboard.js" defer></script>
</body>
</html>

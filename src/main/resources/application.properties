spring.application.name=docurithm
server.port=8081
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect

# Oracle Database Connection
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Docurithm private document storage
trustvault.storage.directory=${TRUSTVAULT_STORAGE_DIR:./trustvault-private-files}

# Upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.application.name=docurithm
server.port=8081
# Database Connection:
# Defaults to embedded H2 file database for seamless zero-config local running.
# Seamlessly connects to Oracle when ORACLE_DB_URL is set in the environment.
spring.datasource.url=${ORACLE_DB_URL:jdbc:h2:file:./data/trustvault;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${ORACLE_DB_USERNAME:sa}
spring.datasource.password=${ORACLE_DB_PASSWORD:}
spring.datasource.driver-class-name=${ORACLE_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${ORACLE_DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Docurithm private document storage
trustvault.storage.directory=${TRUSTVAULT_STORAGE_DIR:./trustvault-private-files}

# Upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Cryptographic Audit HMAC Key (defaults to secure 32-byte key if not overridden)
trustvault.audit.hmac-key=${TRUSTVAULT_AUDIT_HMAC_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}